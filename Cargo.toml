[package]
name = "kelp"
version = "1.9.2"
edition = "2021"
authors = ["UberMetroid", "System76 <info@system76.com>"]
license = "GPL-3.0-or-later"
description = "Kelp — Hardened, zero-subprocess Wayland auto-tiling extension for GNOME 45–51 (EGO compliant) with a zero-dependency Rust installer"
repository = "https://github.com/UberMetroid/kelp"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "kelp"
path = "src/lib.rs"

[[bin]]
name = "kelp"
path = "src/main.rs"
